name: VEZORI — Verificar ingestão oficial Data Engine
# PAUSA TEMPORARIA — 2026-11-12: bloqueado ate aprovacao das regras financeiras.
# Para reativar, restaurar os gatilhos e as condicoes dos jobs do commit anterior.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  official-sources:
    if: ${{ false }} # pausa temporaria; nao executar, nem manualmente
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Ingestão real sem credenciais ou mudança de produção
        run: python -m scripts.data_engine --groups all --no-recovery
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: data-engine-official-evidence
          path: |
            out/engine-run.json
            public/data/engine/manifest.json
          retention-days: 14
