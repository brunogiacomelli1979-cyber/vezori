name: VEZORI — Verificar infraestrutura isoladamente
# PAUSA TEMPORARIA — 2026-11-12: bloqueado ate aprovacao das regras financeiras.
# Para reativar, restaurar os gatilhos e as condicoes dos jobs do commit anterior.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vezori-production
  cancel-in-progress: false
jobs:
  verify-kv:
    if: ${{ false }} # pausa temporaria; nao executar, nem manualmente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/provision*.test.js
      - name: Reutilizar ou provisionar namespace exclusivo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision_kv.mjs --required
      - name: Verificar escrita e persistência em chave diagnóstica separada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-kv.mjs
