name: VEZORI — Verificar infraestrutura isoladamente
on:
  push:
    branches: [feat/vezori-4-audit-reliability]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vezori-production
  cancel-in-progress: false
jobs:
  verify-kv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/provision*.test.js
      - name: Reutilizar ou provisionar namespace exclusivo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision_kv.mjs --required
      - name: Verificar escrita e persistência em chave diagnóstica separada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-kv.mjs
