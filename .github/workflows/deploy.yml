name: VEZORI - Testar e publicar no Cloudflare

# PAUSA TEMPORARIA — 2026-11-12: bloqueado ate aprovacao das regras financeiras.
# Para reativar, restaurar os gatilhos e as condicoes dos jobs do commit anterior.
on:
  workflow_dispatch:

permissions:
  contents: read

# Avoid simultaneous KV namespace creation and conflicting deployments.
concurrency:
  group: vezori-production
  cancel-in-progress: false

jobs:
  price-rights-gate:
    if: ${{ false }} # pausa temporaria; nao executar, nem manualmente
    # Condicao original: ${{ github.event.schedule == '30 23 * * 1-5' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::EOD bloqueado por direitos de exibição/retencao nao comprovados. Nenhum fornecedor foi consultado, preco criado ou flag habilitada."
  test-and-deploy:
    if: ${{ false }} # pausa temporaria; nao executar, nem manualmente
    # Condicao original: ${{ github.event.schedule != '30 23 * * 1-5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_ACCOUNT_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Verificar sintaxe e executar testes
        run: npm run check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar extratores e publicação CVM
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar bibliotecas locais com versões fixadas
        run: npm run build
      - name: Ingerir ciclo oficial e preservar o lote anterior
        env:
          ENGINE_GROUPS: ${{ inputs.data_groups || 'all' }}
          ENGINE_SCHEDULE: ${{ github.event.schedule }}
          SEC_USER_AGENT: ${{ vars.SEC_DATA_ENABLED == 'true' && secrets.SEC_USER_AGENT || '' }}
        run: python -m scripts.data_engine --groups "$ENGINE_GROUPS" --schedule "$ENGINE_SCHEDULE"

      - name: Avisar quando o Cloudflare nao estiver configurado
        if: ${{ env.CF_TOKEN_CONFIGURED != 'true' || env.CF_ACCOUNT_CONFIGURED != 'true' }}
        run: |
          echo "::error::Deploy bloqueado. Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
          exit 1

      - name: Preparar armazenamento KV da VEZORI sem recursos pagos
        if: ${{ env.CF_TOKEN_CONFIGURED == 'true' && env.CF_ACCOUNT_CONFIGURED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision_kv.mjs --required

      - name: Comprovar escrita e releitura KV sem alterar dados financeiros
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-kv.mjs

      - name: Registrar versão anterior para recuperação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/save-deployment.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vezori-rollback-${{ github.sha }}-${{ github.run_attempt }}
          path: out/rollback.json
          retention-days: 30

      - name: Publicar VEZORI via Wrangler
        if: ${{ env.CF_TOKEN_CONFIGURED == 'true' && env.CF_ACCOUNT_CONFIGURED == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var RELEASE_SHA:${{ github.sha }}

      - name: Captura controlada de observação oficial autorizada (BCB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/capture-authorized.mjs

      - name: Registrar e reler execução Data Engine no KV existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/record-engine-run.mjs

      - name: Aceite real do lote, fontes, indicadores e armazenamento
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-data-engine.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-engine-acceptance-${{ github.run_attempt }}
          path: |
            out/engine-run.json
            out/data-engine-live-evidence.json
            public/data/engine/manifest.json
          retention-days: 30

      - name: Validar site e dados reais publicados
        if: ${{ env.CF_TOKEN_CONFIGURED == 'true' && env.CF_ACCOUNT_CONFIGURED == 'true' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://vezori.bruno-giacomelli1979.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import {analyzeAssetRisk} from './public/risk-analytics.js';
          import {analyzeHistoricalBasket} from './public/portfolio-risk.js';
          const root = process.env.SITE_URL;
          async function read(path) {
            const response = await fetch(root + path, {signal: AbortSignal.timeout(25000)});
            if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
            return path === '/' ? response.text() : response.json();
          }
          const html = await read('/');
          if (!/VEZORI/i.test(html)) throw new Error('A pagina principal nao contem a marca VEZORI');
          const health = await read('/api/health');
          if (health.service !== 'VEZORI' || health.status !== 'ok') throw new Error('API de saude invalida');
          if(health.release!==process.env.EXPECTED_SHA||health.version!=='4.0.0')throw new Error('Commit/versao publicados divergentes');
          if(!health.sourcesConfigured?.marketSnapshotStorage)throw new Error('Deploy sem MARKET_SNAPSHOTS: arquivo historico nao sera persistido');
          console.log('ARMAZENAMENTO PERSISTENTE: KV vinculado');
          const cvm=await read('/api/fundamentals?market=BR&symbol=PETR3');
          if(cvm.status!=='verified_accounts'||cvm.symbol!=='PETR3'||!cvm.accounts?.length||!cvm.sourceSha256)throw Error('CVM PETR3 nao publicado');
          console.log('CVM PETR3:',cvm.periodEnd,cvm.accounts.length,'contas oficiais');
          const market = await read('/api/dashboard');
          if (market.mode !== 'real_market_data' || market.meta?.simulatedPrices !== false) throw new Error('Metadados de mercado invalidos');
          if (!Array.isArray(market.quotes) || !Array.isArray(market.errors)) throw new Error('Contrato de dashboard invalido');
          const validQuotes = market.quotes.filter(q => Number.isFinite(q.price) && q.price > 0 && q.provider);
          if (!html.includes('id="research-risk-metrics"') || !html.includes('id="lab-risk-study"') || !html.includes('id="lab-basket-result"')) throw new Error('Modulos de risco ausentes no HTML publicado');
          if (!html.includes('id="research-price-zones"') || !html.includes('id="research-crypto-sentiment"')) throw new Error('Paineis de faixas e sentimento ausentes no HTML publicado');
          if (!html.includes('id="storage-diagnostic-status"')) throw new Error('Diagnostico do armazenamento nao esta na aba Integracoes');
          if (!html.includes('<option value="max">Máximo disponível</option>')) throw new Error('Controles de historia longa nao publicados');
          let storage;
          for(let attempt=0;attempt<10;attempt++){
            const response=await fetch(root+'/api/storage-status?probe='+Date.now(),{signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error('Diagnostico KV inacessivel: '+response.status);
            storage=await response.json();
            if(storage.status==='active'&&storage.latestSnapshot?.macroObservations>0)break;
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(storage?.status!=='active'||!(storage.latestSnapshot?.macroObservations>0))throw Error('Captura macro oficial nao legivel pelo Worker apos espera limitada');
          console.log('ARQUIVO PERSISTENTE ATIVO:',storage.latestSnapshot.date,storage.latestSnapshot.macroObservations,'observacoes macro;',storage.latestSnapshot.integrity);
          const observationResponse=await fetch(root+'/api/observations?market=CRYPTO&symbol=BTC&months=2',{signal:AbortSignal.timeout(15000)});
          if(!observationResponse.ok)throw new Error('Endpoint de arquivo diario indisponivel');
          const observations=await observationResponse.json();
          if(!['storage_not_configured','no_observations','available'].includes(observations.status))throw new Error('Contrato de arquivo diario invalido');
          if(observations.status==='available'){
           if(observations.priceBasis!=='cotação capturada uma vez ao dia, não fechamento oficial'||observations.coverage?.completeSinceListing!==false)throw new Error('Arquivo diario rotulado indevidamente como historico completo');
          }else console.log('::warning::Arquivo de observacoes ainda nao possui cobertura: '+observations.status);
          const historicalMax=await fetch(root+'/api/history?market=BR&symbol=PETR4&range=max',{signal:AbortSignal.timeout(25000)});
          if(historicalMax.ok){
           const series=await historicalMax.json();
           if(series.range!=='max'||!Array.isArray(series.points)||series.coverage?.completeSinceListing!==false)throw new Error('Serie longa sem transparencia de cobertura');
          }else console.log('::warning::Historico max sem cobertura no provedor: HTTP '+historicalMax.status);

          const zonesJs=await fetch(root+'/price-zones.js',{signal:AbortSignal.timeout(15000)});
          if(!zonesJs.ok || !(await zonesJs.text()).includes('suggestPriceZones'))throw new Error('Motor de faixas indicativas nao publicado');
          const researchJs=await fetch(root+'/research.js',{signal:AbortSignal.timeout(15000)});
          if(!researchJs.ok || !(await researchJs.text()).includes('suggestPriceZones'))throw new Error('Pesquisa nao integra o motor de faixas');
          const sentiment=await fetch(root+'/api/crypto-sentiment',{signal:AbortSignal.timeout(15000)});
          if(![200,422].includes(sentiment.status))throw new Error('Rota de sentimento cripto indisponivel: '+sentiment.status);

          const riskResponse = await fetch(root + '/risk-analytics.js', {signal: AbortSignal.timeout(15000)});
          if (!riskResponse.ok || !(await riskResponse.text()).includes('analyzeAssetRisk')) throw new Error('Modulo quantitativo indisponivel em producao');
          const basketResponse = await fetch(root + '/portfolio-risk.js', {signal: AbortSignal.timeout(15000)});
          if (!basketResponse.ok || !(await basketResponse.text()).includes('analyzeHistoricalBasket')) throw new Error('Modulo de cesta historica indisponivel em producao');
          try {
            const historyResponse = await fetch(root + '/api/history?market=BR&symbol=PETR4&range=3mo', {signal: AbortSignal.timeout(16000)});
            if (historyResponse.ok) {
              const history = await historyResponse.json();
              if (history.symbol !== 'PETR4' || !Array.isArray(history.points) || history.points.some(p => !Number.isFinite(p.close) || p.close <= 0)) throw new Error('Historico PETR4 invalido');
              console.log('HISTORICO REAL PETR4:', history.points.length, 'fechamentos');
              if (history.points.length > 30) {
                const risk = analyzeAssetRisk(history);
                if (!Number.isFinite(risk.maxDrawdownPct) || !Number.isFinite(risk.volatilityAnnualPct)) throw new Error('Metrica de risco inconsistente');
                console.log('RISCO PETR4:', risk.observations, 'fechamentos, drawdown', risk.maxDrawdownPct, '% e volatilidade', risk.volatilityAnnualPct, '% aa');
              }
            } else console.log('::warning::Historico de PETR4 nao disponivel no provedor durante o smoke: HTTP ' + historyResponse.status);
          } catch (err) {
            console.log('::warning::Nao foi possivel confirmar historico PETR4 agora: ' + err.message);
          }
          try {
            const pair=await Promise.all(['PETR4','VALE3'].map(async symbol=>{
              const response=await fetch(root + '/api/history?market=BR&symbol=' + symbol + '&range=3mo', {signal: AbortSignal.timeout(16000)});
              if (!response.ok) throw new Error(symbol + ' HTTP ' + response.status);
              const data=await response.json();
              if (data.symbol !== symbol || data.market !== 'BR') throw new Error('Historico nao corresponde a ' + symbol);
              return {symbol,weight:50,series:data};
            }));
            const basket=analyzeHistoricalBasket(pair);
            if (!Number.isFinite(basket.returnPct) || !Number.isFinite(basket.volatilityAnnualPct) || basket.observations<31) throw new Error('Cesta real com metrica inconsistente');
            console.log('CESTA HISTORICA REAL:', pair.map(x=>x.symbol).join('/'), basket.observations, 'datas comuns, volatilidade', basket.volatilityAnnualPct, '% aa');
          } catch (error) {
            console.log('::warning::Cesta historica BR nao validada no provedor nesta execucao: ' + error.message);
          }
          if (!html.includes('id="home-rankings"') || !/\/home\.css\?v=\d+/.test(html) || !html.includes('id="lab-zero-warning"')) throw new Error('Frontend de mercados e laboratorio nao esta publicado');
          if(health.sourcesConfigured.brPublicDisplayAuthorized){
          const catalog = await read('/api/catalog?limit=5&page=1');
          if (catalog.mode !== 'real_market_catalog' || !Array.isArray(catalog.items) || !catalog.items.length) throw new Error('Catalogo B3 sem itens da fonte');
          if (catalog.items.some(item => !item.symbol || !item.provider)) throw new Error('Itens B3 sem origem verificavel');
          console.log('CATALOGO B3:', catalog.items.length, 'de', catalog.totalCount ?? 'total nao fornecido');
          }else{
            const gated=await fetch(root+'/api/catalog?limit=5&page=1');
            if(gated.status!==422)throw Error('Catálogo B3 liberado sem autorização de redistribuição');
            console.log('B3: adaptador preservado, redistribuição bloqueada até autorização documentada');
          }
          console.log('SITE ONLINE:', root);
          console.log('HEALTH:', health.status);
          console.log('COTACOES COM PRECO REAL:', validQuotes.length);
          console.log('CAMBIO:', market.fx?.length ?? 0, 'MACRO:', market.macro?.length ?? 0);
          console.log('FALHAS DE PROVEDOR:', JSON.stringify(market.errors));
          if (!validQuotes.length) {
            console.log('::warning::Nenhuma cotacao de ativo disponivel; fornecedores temporariamente indisponiveis.');
            if (!(market.fx?.length || market.macro?.length)) throw new Error('Nenhuma fonte real de mercado responde');
          }
          NODE
