name: Testes do motor financeiro e das APIs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verificar sintaxe
        run: |
          node --check src/worker.js
          node --check public/finance.js
          node --check public/app.js
      - name: Executar testes (sem credenciais)
        run: node --test tests/*.test.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar extrator CVM
        run: python -m unittest discover -s tests -p 'test_cvm_extract.py'
