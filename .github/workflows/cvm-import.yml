name: CVM — Extrair demonstrativos oficiais (manual)
# PAUSA TEMPORARIA — 2026-11-12: bloqueado ate aprovacao das regras financeiras.
# Para reativar, restaurar os gatilhos e as condicoes dos jobs do commit anterior.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  cvm-extract:
    if: ${{ false }} # pausa temporaria; nao executar, nem manualmente
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TICKER: ${{ inputs.ticker }}
      CNPJ: ${{ inputs.cnpj }}
      YEAR: ${{ inputs.year }}
      KIND: ${{ inputs.kind }}
      SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testar extrator com demonstrações sintéticas
        run: python -m unittest discover -s tests -p 'test_cvm_extract.py'
      - name: Processar dados oficiais e rastrear revisão
        run: |
          mkdir -p out
          python -m scripts.cvm_extract \
            --ticker "$TICKER" --cnpj "$CNPJ" --year "$YEAR" \
            --kind "$KIND" --scope "$SCOPE" --out "out/facts.json"
      - name: Arquivar resultado para validação humana
        uses: actions/upload-artifact@v4
        with:
          name: cvm-facts-${{ inputs.ticker }}-${{ inputs.year }}-${{ inputs.kind }}
          path: out/facts.json
          retention-days: 30
